<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script>
// This file is served for every route (see PageRoutes.cpp) with the same
// body regardless of the specific path — so unlike the old server-rendered
// pages, it can't have a reverse-proxy subpath (e.g. "/wiki") baked into
// its own resource links from request data. Fixed here instead, as the
// very first thing in <head>, before the parser reaches any
// <link>/<script src> below: infer the mount prefix from the CURRENT URL
// by matching it against the same route shapes PageRoutes.cpp registers
// (unless PageRoutes.cpp already injected an authoritative
// window.__WIKI_KNOWN_BASE_PATH__ just above this tag — see below), and
// set a <base> so every RELATIVE href/src in this document (deliberately
// none of them start with "/") resolves correctly regardless of how deep
// the current route is or what prefix (if any) this app is mounted under.
// window.__WIKI_BASE_PATH__ is also exposed for common.js's basePath() to
// reuse for its own absolute (basePath-prefixed) API/page URLs.
(function () {
  "use strict";
  var path = location.pathname;
  var prefix = "";
  var matched = false;
  // window.__WIKI_KNOWN_BASE_PATH__ is injected by PageRoutes.cpp itself,
  // BEFORE this script tag, only when [server].base_path is set in
  // config.toml (optional — see AppConfig.h's comment on why it exists:
  // a genuinely unmatched path, e.g. a stale [[wiki-link]] served by
  // main.cpp's setDefaultHandler, on a browser with nothing yet cached in
  // localStorage, is a case pattern-matching below can NEVER recover a
  // prefix for — there's no signal left client-side at all in that exact
  // combination). Authoritative when present: skip guessing entirely.
  if (typeof window.__WIKI_KNOWN_BASE_PATH__ === "string") {
    prefix = window.__WIKI_KNOWN_BASE_PATH__;
    matched = true;
  } else {
    var patterns = [/\/d\/.*$/, /\/edit\/.*$/, /\/history\/.*$/, /\/folder(\/.*)?$/, /\/search\/?$/, /\/login\/?$/, /\/account\/?$/];
    for (var i = 0; i < patterns.length; i++) {
      var m = path.match(patterns[i]);
      if (m) {
        prefix = path.slice(0, m.index);
        matched = true;
        break;
      }
    }
  }
  // Bare "/" or exactly this deployment's own mount root (e.g. visiting
  // "/wiki" or "/wiki/" with nothing after) — no known route suffix to
  // anchor on, so there's nothing to strip; unprefixed deployments hit
  // this branch too (matched stays false, prefix stays "").
  //
  // Tracked via a separate `matched` flag rather than testing `!prefix` —
  // confirmed the hard way in a real headless-browser test: an UNPREFIXED
  // deployment (no reverse-proxy subpath at all — e.g. hitting the app
  // directly, no "/wiki/" in front) legitimately produces prefix === ""
  // from a route matching right at the start of the path, and "" is
  // falsy in JS. Testing `!prefix` there is indistinguishable from "the
  // loop found nothing at all", so it fell through to a since-removed
  // fallback that overwrote the correct empty prefix with the ENTIRE
  // current path — see the CACHE_KEY block below for the actual
  // fallback logic and why "whole path = prefix" was wrong on a second,
  // separate count too.
  var CACHE_KEY = "wiki.lastKnownBasePath";
  if (matched) {
    // A route matched (server-confirmed via __WIKI_KNOWN_BASE_PATH__, or
    // inferred from a recognized path shape) — `prefix` is now known-good,
    // cache it for the branch below to fall back on the one time it can't
    // determine this itself: an unrecognized path with __WIKI_KNOWN_BASE_PATH__
    // absent (base_path not configured) and nothing cached yet either.
    try {
      localStorage.setItem(CACHE_KEY, prefix);
    } catch (e) {
      // Blocked/unavailable localStorage — the fallback below just
      // won't have anything cached to reuse; nothing else breaks.
    }
  } else if (path !== "/") {
    // No known route matched, and this isn't the bare mount root either
    // — e.g. Drogon's own default handler (main.cpp) serving this same
    // shell.html for a genuinely unmatched path (a typo, an old/broken
    // link) with a 404 status. "Assume the entire path is the prefix"
    // was the original fallback here, and it was WRONG in exactly this
    // case: caught live testing a real broken [[wiki-link]] href through
    // a real nginx reverse-proxy under "/wiki/" — <base> ended up
    // pointing AT the broken path itself, so every CSS/JS request 404'd
    // through the SAME broken base, rendering a permanently stuck,
    // unstyled "Loading…" page instead of a real not-found message.
    // There is no way to reliably tell "prefix + garbage tail" apart
    // from "no prefix + different garbage tail" from an unrecognized
    // path alone — this file has no way to know, for instance, whether
    // "wiki" in the path is this deployment's actual mount prefix or
    // just a directory a author happened to name that. Reusing whatever
    // prefix the MOST RECENT successful page load already proved
    // correct is the closest thing to a right answer available: the
    // realistic way a reader reaches a broken link is by clicking one
    // FROM an already-loaded page on this same site, which means the
    // cache is already warm by the time this branch ever runs. Falls
    // back to empty (matching the bare "/" case) only on a genuinely
    // cold start — no page on this site loaded successfully yet in this
    // browser at all — which stays wrong for a subpath deployment on
    // that one first visit, same residual gap "/" itself always had.
    try {
      var cached = localStorage.getItem(CACHE_KEY);
      if (cached !== null) prefix = cached;
    } catch (e) {
      // Blocked/unavailable localStorage — falls through with prefix
      // still "", the same safe default as a cold start.
    }
  }
  window.__WIKI_BASE_PATH__ = prefix;
  var base = document.createElement("base");
  base.href = prefix + "/";
  document.head.appendChild(base);
})();
</script>
<!-- Tells the browser this page IS dark on purpose (theme.css's --bg is a
     hardcoded #000, no light variant exists at all) — without this,
     Chrome's own "Force Dark Mode for websites" setting (chrome://flags,
     confirmed present in this session's browser via --force-dark-mode)
     doesn't know that and applies its OWN heuristic re-coloring on top
     of ours, which was caught silently suppressing toolbar icon sprites
     (background-image computing to "none" despite a verified-valid,
     loadable data-URI in the CSS) — not a bug in this app's own CSS,
     but worth neutralizing here since any visitor with that Chrome
     setting on would hit the same thing. color-scheme is the documented
     signal Chromium's forced-darkening explicitly checks before
     deciding whether a page needs its help. -->
<meta name="color-scheme" content="dark">
<title id="page-title">wiki</title>
<link rel="stylesheet" href="css/theme.css">
<!-- Edit-page-specific layout (.field-row, .visibility-toggle, #f-status
     colors, .yt-embed-preview) — was a real, orphaned file for who knows
     how long before this link existed: edit.css was written, referenced
     by class/id from pages/edit.js, and documented in theme.css's own
     header comment, but never actually <link>ed anywhere, so none of its
     rules had EVER applied to a real page load. Found by testing the
     YouTube-embed WYSIWYG preview live rather than trusting a green
     ctest run — unrelated to that feature, fixed alongside it since it
     was the same file this session already had open. -->
<link rel="stylesheet" href="css/edit.css">
<link rel="stylesheet" href="js/toastui-editor/toastui-editor.css">
<!-- Official dark theme (theme: 'dark' in pages/edit.js's Editor
     constructor call applies the .toastui-editor-dark class it's scoped
     under) — the editor's own UI used to be stock light-theme white
     inside an otherwise all-black page. Not a pixel-perfect match for
     the green terminal look, but a real, maintained theme beats hand-
     rolled CSS overrides fighting a third-party component's internals. -->
<link rel="stylesheet" href="js/toastui-editor/toastui-editor-dark.css">
</head>
<body>
<canvas id="matrix-bg"></canvas>
<div class="layout">
<nav class="sidebar">
  <a class="sidebar-brand" data-href="/" href="#">wiki</a>
  <div class="sidebar-links">
    <a data-href="/search" href="#">Search</a>
    <a data-href="/folder" href="#">Browse</a>
    <button type="button" id="sidebar-new-doc" hidden>+ New</button>
    <a id="sidebar-account" data-href="/account" href="#" hidden>Password</a>
    <button type="button" id="sidebar-logout" hidden>Log out</button>
  </div>
  <span class="quick-open-hint">Ctrl+K to jump to a document</span>
  <div class="sidebar-section"><h3>Documents</h3><div id="nav-tree"></div></div>
  <div class="sidebar-section"><h3>Tags</h3><div id="nav-tags"></div></div>
</nav>
<!-- Drag handle for sidebar-resize.js — a hair's-width strip between the
     sidebar and the content column, not part of either. Hidden on the
     narrow/stacked layout (see theme.css's max-width:720px block) where
     there's no side-by-side width to negotiate. -->
<div class="sidebar-resizer" id="sidebar-resizer"></div>
<main id="app-content" class="content">Loading&hellip;</main>
</div>

<!-- router.js reads location.pathname and renders the actual page into
     #app-content from JSON fetched off /api/* — the server never builds
     HTML from a request. See docs/architecture.md's frontend section. -->

<!-- common.js MUST load first — everything else reads window.WikiCommon
     at its own top level, not lazily inside an event handler. -->
<script src="js/common.js"></script>
<script src="js/diff.js"></script>
<script src="js/matrix.js"></script>
<script src="js/sidebar-resize.js"></script>
<script src="js/quick-open.js"></script>
<script src="js/nav.js"></script>
<script src="js/document.js"></script>
<script src="js/toastui-editor/toastui-editor.min.js"></script>
<script src="js/youtube-embed-preview.js"></script>
<script src="js/pages/login.js"></script>
<script src="js/pages/search.js"></script>
<script src="js/pages/view.js"></script>
<script src="js/pages/edit.js"></script>
<script src="js/pages/history.js"></script>
<script src="js/pages/folder.js"></script>
<script src="js/pages/account.js"></script>
<script src="js/router.js"></script>
</body>
</html>
