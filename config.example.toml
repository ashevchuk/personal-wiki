# Copy to config.toml, in the SAME directory wiki-server/wiki-mcp are run
# from (both look for "config.toml" relative to the process's current
# working directory, falling back to this file — config.example.toml —
# if it's missing; there's no env var to point at a different path).
# config.toml is gitignored — never commit a real one.
#
# No secret of any kind lives in this file OR in an environment variable
# — nothing in wiki-server reads one. The admin password is entered once,
# interactively, via `wiki-server --create-admin` (argon2id hash goes
# straight into SQLite); session and remote-MCP tokens are random opaque
# values, not signed by any secret. systemd/wiki.env.example stays a
# documented hook for a future feature that might genuinely need one.

[server]
listen_addr = "127.0.0.1"   # put behind a reverse proxy for TLS/public exposure
port = 8080
threads = 2
# Reverse-proxying under a subpath (e.g. "/wiki") needs NO setting here
# for the common case — the frontend is a static SPA shell + client-side
# JS (see docs/architecture.md); shell.html's own inline bootstrap script
# infers the mount prefix from the browser's current URL at load time. A
# plain prefix-stripping `location /wiki/ { proxy_pass ...; }` just works.
#
# base_path = "/wiki"
#
# Set the line above (restart after changing it) ONLY to close one
# specific residual gap that URL-pattern-matching alone can never solve:
# a request whose path matches none of this app's known routes (a typo,
# a stale [[wiki-link]]) on a browser that hasn't loaded any page from
# this site yet either — no signal is left client-side to recover the
# prefix from in that exact combination. Setting this bakes the prefix
# into every page server-side instead, closing the gap completely. Not
# needed for a deployment on its own (sub)domain, and not needed if you
# don't mind that one edge case staying unstyled (never crashes, just
# looks broken) on a visitor's very first hit.
#
# theme = "green"
#
# Which of the three site themes (classic / dark / green) a FRESH
# browser — no wiki.theme saved in localStorage yet — lands on
# (restart after changing it). Optional; leave unset for "green", the
# same default this app has always had. Never overrides a reader's own
# choice from the sidebar's theme picker, only what a first-time visitor
# sees before making one. An unrecognized value here is treated exactly
# like leaving this unset — no validation happens server-side, since
# shell.html's own bootstrap script already checks this against its
# real theme list before ever using it.

[vault]
# Root directory of the markdown vault (source of truth for all content).
path = "./vault_data"

[index]
# SQLite index/cache db — fully rebuildable from the vault via
# `wiki-server --reindex`, never treated as a second source of truth.
db_path = "./vault_data/.index.db"

[mcp]
# admin  — wiki-mcp sees public + private documents (default; the stdio
#          process is spawned locally by the wiki's own owner).
# public — wiki-mcp sees only public documents. Use for any future
#          remote/shared MCP transport.
scope = "admin"
# Phase 2: exposes create_document/update_document tools, letting an MCP
# client (an LLM) write to the vault, not just read it. Off by default —
# a conscious opt-in, not a silent capability bump on rebuild. Every
# write (success or failure) is recorded in the mcp_audit_log table
# regardless of this setting's history, so you can always review what
# was written after the fact.
write_access = false

# Any file can be uploaded as an attachment regardless of extension (see
# vault/AttachmentService.h) — nothing to configure to allow/deny a type.
# What IS configurable here is presentation only: the guessed Content-Type
# and whether a browser is allowed to render a given extension inline
# when it navigates straight to an attachment's URL (GET /assets/...) —
# everything else is served with Content-Disposition: attachment (forced
# download) instead, which is what actually prevents an uploaded
# .html/.svg/etc from executing same-origin script; it is NOT a security
# setting to loosen carelessly. Leave this whole section out entirely
# (as below, commented) to use the built-in defaults — see
# AttachmentService::defaultMimeTypes() / defaultInlineSafeExtensions()
# in src/vault/AttachmentService.cpp for exactly what those are. If you
# DO uncomment [attachments.mime_types] or inline_safe_extensions, that
# table/array REPLACES the built-in list entirely (not merged) — copy the
# full default list from AttachmentService.cpp first if you just want to
# add one extension.
#
# [attachments.mime_types]
# ini = "text/plain"
# conf = "text/plain"
#
# [attachments]
# inline_safe_extensions = ["png", "jpg", "jpeg", "gif", "webp", "pdf", "txt", "md", "mp3", "mp4", "webm", "csv", "json", "ogg", "wav"]

[log]
level = "info"   # trace | debug | info | warn | error
