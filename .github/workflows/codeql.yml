name: CodeQL

# GitHub's static analysis (CodeQL) on this project's OWN C++ source —
# a different, complementary check from ci.yml's tests: this looks for bug
# PATTERNS in code we wrote (buffer overflows, injection, use-after-free,
# etc. via semantic analysis of the compiled translation units), not
# regressions against expected behavior. Also a different problem from
# vcpkg dependency CVE scanning (investigated separately, see
# docs/architecture.md — that doesn't work for this project's C/C++
# dependencies at all).
#
# Scoped to src/ and tests/ by STEP ORDER, not by a paths/paths-ignore
# config filter — see the comment on the "Configure" step below for why
# that filter doesn't actually work here and what real live incident
# (70 alerts against vcpkg's own OpenSSL/c-ares/zlib sources) proved it.
#
# build-mode: manual, not autobuild — CodeQL's autobuild guesses a generic
# `cmake && make` invocation for a CMake project, which would miss
# -DCMAKE_TOOLCHAIN_FILE=vcpkg/... entirely and fail to find any
# dependency. Reuses the exact same vcpkg setup as ci.yml so CodeQL's
# extractor intercepts the real compiler invocations against the real
# dependency graph, not a stub build.

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 4 * * 1'  # Monday 04:43 UTC, offset from ci.yml's own weekly run
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            curl zip unzip tar git python3 \
            autoconf automake autoconf-archive libtool m4 bison flex nasm

      # Same FULL-clone reasoning as ci.yml — see that workflow's own
      # comment, and docs/architecture.md's "git clone vcpkg with a FULL
      # clone" entry.
      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git vcpkg

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-

      # Configure BEFORE CodeQL init, deliberately. CMake's configure step
      # is what actually triggers vcpkg manifest-mode install -- meaning
      # every dependency (OpenSSL, c-ares, zlib, md4c, ...) that isn't
      # already cache-hit gets COMPILED FROM SOURCE right here, in
      # vcpkg/buildtrees/. paths/paths-ignore in CodeQL's config CANNOT
      # exclude that: GitHub's own docs are explicit that for a compiled
      # language under build-mode manual/autobuild, paths/paths-ignore
      # only applies "where code is built ... without building the code"
      # -- i.e. it's a no-op once a real build is involved, and exclusion
      # has to happen by not compiling the files at all. A `paths: [src,
      # tests]` allowlist was tried here first and looked fine on every
      # push run, purely because actions/cache kept hitting (same
      # vcpkg.json hash) and vcpkg had nothing left to rebuild -- the
      # illusion broke on the weekly schedule run, which hit a cold cache,
      # rebuilt every vcpkg port from source, and CodeQL (already tracing
      # by then) dutifully flagged 70 real-looking alerts in
      # vcpkg/buildtrees/openssl/... none of which are this project's code.
      #
      # The actual fix: do the vcpkg-triggering configure step BEFORE
      # `codeql-action/init` turns on compiler tracing, so dependency
      # builds happen outside the traced window entirely. Only the
      # `cmake --build` step below (which, once configure has already
      # installed every dependency, just compiles src/ and tests/ plus
      # links the prebuilt deps) runs traced.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual

      - name: Build (traced by CodeQL)
        run: cmake --build build -j"$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"
